# Delta Lake backed by the Databricks Unity Catalog metastore (read-only).
connector.name=delta_lake
delta.metastore.type=UNITY_CATALOG

delta.unity-catalog.uri=${ENV:UC_URI}
delta.unity-catalog.catalog-name=${ENV:UC_CATALOG}

# Auth: TOKEN (personal access token / service principal token)
delta.unity-catalog.security=TOKEN
delta.unity-catalog.token=${ENV:UC_TOKEN}

# For OAuth2 client credentials instead, comment the two lines above and use:
#delta.unity-catalog.security=OAUTH2
#delta.unity-catalog.oauth2.token-uri=${ENV:UC_OAUTH_TOKEN_URI}
#delta.unity-catalog.oauth2.client-id=${ENV:UC_CLIENT_ID}
#delta.unity-catalog.oauth2.client-secret=${ENV:UC_CLIENT_SECRET}

delta.unity-catalog.metastore-cache-ttl=1m
delta.unity-catalog.hide-non-delta-lake-tables=true

# Object storage holding the Delta tables. Enable whichever applies.
fs.native-s3.enabled=true
s3.region=${ENV:AWS_REGION}
#fs.native-azure.enabled=true
#fs.native-gcs.enabled=true
